<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar · MiParqueo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
</head>
<body class="pagina--centrada">

  <main class="acceso">
    <a class="brand brand--centrada" href="index.html">
      <span class="brand__mark" aria-hidden="true">P</span>
      <span class="brand__text">MiParqueo <span class="brand__campus">· PUCMM</span></span>
    </a>

    <div class="tarjeta">
      <h1 class="tarjeta__titulo">Entrar</h1>
      <p class="tarjeta__sub">Con tu correo institucional de la PUCMM.</p>

      <form id="formEntrar" class="formulario" novalidate>
        <label class="campo">
          <span class="campo__etiqueta">Correo institucional</span>
          <input class="campo__input" type="email" id="correo" name="correo"
                 placeholder="tunombre@ce.pucmm.edu.do" autocomplete="email" required />
        </label>

        <label class="campo" id="campoClave">
          <span class="campo__etiqueta">Contraseña</span>
          <input class="campo__input" type="password" id="clave" name="clave"
                 autocomplete="current-password" />
        </label>

        <label class="campo" id="campoNombre" hidden>
          <span class="campo__etiqueta">Nombre completo</span>
          <input class="campo__input" type="text" id="nombre" name="nombre"
                 placeholder="Como aparece en tu carnet" autocomplete="name" />
        </label>

        <button class="btn btn--primary btn--bloque" type="submit" id="btnEnviar">
          Entrar
        </button>
      </form>

      <p class="aviso" id="aviso" hidden></p>

      <p class="tarjeta__alterna">
        <button class="enlace" type="button" id="btnAlternar">
          ¿Primera vez? Entrar con un enlace por correo
        </button>
      </p>

      <p class="tarjeta__pie">
        <a href="index.html">Ver la disponibilidad sin entrar</a>
      </p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/entrar.js"></script>
</body>
</html>
