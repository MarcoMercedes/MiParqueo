name: Publicar en GitHub Pages

# La aplicacion vive en frontend/, no en la raiz del repositorio.
# Este flujo publica solo esa carpeta cada vez que se sube a main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.desplegar.outputs.page_url }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Pages
        uses: actions/configure-pages@v5

      - name: Empaquetar la carpeta frontend
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

      - name: Desplegar
        id: desplegar
        uses: actions/deploy-pages@v4
